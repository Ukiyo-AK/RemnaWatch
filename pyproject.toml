[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remnawatch"
version = "0.2.0"
description = "Passive Xray domain activity monitoring"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
remnawatch = "remnawatch.__main__:main"

[tool.setuptools.packages.find]
include = ["remnawatch*"]
