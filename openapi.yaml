openapi: 3.1.0
info:
  title: RemnaWatch Domain Activity API
  version: 0.1.0
  description: >-
    Sensitive connection metadata. Registered events do not prove page visits.
    UTC whole-second half-open intervals. Quality never guarantees complete coverage.
servers:
  - url: http://127.0.0.1:8080
security:
  - BearerAuth: []
paths:
  /v1/domains:
    get:
      operationId: listDomains
      summary: Domain and destination IP statistics, including IP-only rows
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Period'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/User'
        - $ref: '#/components/parameters/Node'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/View'
        - $ref: '#/components/parameters/Bucket'
      responses:
        '200':
          $ref: '#/components/responses/Statistics'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Busy'
  /v1/domains/top:
    get:
      operationId: topDomains
      summary: Domains ranked by registered connection count; IP-only excluded
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Period'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/User'
        - $ref: '#/components/parameters/Node'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          $ref: '#/components/responses/Statistics'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Busy'
  /v1/domains/{domain}/users:
    get:
      operationId: domainUsers
      summary: Users with events for an exact normalized domain
      parameters:
        - name: domain
          in: path
          required: true
          description: Unicode or IDNA hostname, normalized to lowercase without trailing dot; IPs rejected
          schema: {type: string, maxLength: 253}
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Period'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/User'
        - $ref: '#/components/parameters/Node'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          $ref: '#/components/responses/Statistics'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Busy'
  /v1/users/{id}/domains:
    get:
      operationId: userDomains
      summary: User domain statistics or hourly/daily activity
      parameters:
        - $ref: '#/components/parameters/UserPath'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Period'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/User'
        - $ref: '#/components/parameters/Node'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/View'
        - $ref: '#/components/parameters/Bucket'
      responses:
        '200':
          $ref: '#/components/responses/Statistics'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Busy'
  /v1/users/{id}/domains/history:
    get:
      operationId: userDomainHistory
      summary: Detailed connection history or aggregated hourly/daily activity
      description: >-
        Details retained 7 days by default. view=activity uses aggregate retention
        (30 days by default). Quality connection counts refer to aggregate retention.
      parameters:
        - $ref: '#/components/parameters/UserPath'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Period'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/User'
        - $ref: '#/components/parameters/Node'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/View'
        - $ref: '#/components/parameters/Bucket'
      responses:
        '200':
          $ref: '#/components/responses/Statistics'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Busy'
  /v1/users/{id}/domains/top:
    get:
      operationId: userTopDomains
      summary: User domains ranked by registered connections
      parameters:
        - $ref: '#/components/parameters/UserPath'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Period'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/User'
        - $ref: '#/components/parameters/Node'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          $ref: '#/components/responses/Statistics'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Busy'
  /v1/server:
    get:
      operationId: serverInfo
      summary: Host characteristics, current load, resource alerts and configured management capabilities
      responses:
        '200':
          description: Unknown Linux metrics are null; rates cover time since previous sample
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServerStatus'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /v1/server/jobs:
    get:
      operationId: serverJobs
      summary: Persistent administrative job audit
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Jobs sorted by creation time, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit, offset]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ServerJob'}}
                  total: {type: integer}
                  limit: {type: integer}
                  offset: {type: integer}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Busy'}
  /v1/server/jobs/{id}:
    get:
      operationId: serverJob
      summary: Inspect one job, including partial completion or failure
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Job status; succeeded does not guarantee remote node health
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServerJob'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404':
          description: Unknown job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Busy'}
  /v1/server/actions:
    post:
      operationId: serverAction
      summary: Preview or explicitly execute an allowlisted Linux action
      description: >-
        Shared admin Bearer token. Default dry_run=true executes no system commands.
        Actual execution needs enabled config and unique request_id. One job at a time.
        Reboot/restart/update interrupts connections. No automatic retry after restart.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ActionRequest'}
      responses:
        '200':
          description: Dry-run plan only
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActionPlan'}
        '202':
          description: Job queued or existing idempotent job returned
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServerJob'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: Management disabled by configuration
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: Conflicting request ID, existing job, resource pressure or audit limit
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '501':
          description: Unsupported OS or unconfigured action
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Busy'}
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Shared service token, not a per-user token; panel backend enforces tenant access
  parameters:
    From:
      name: from
      in: query
      description: Inclusive Unix UTC seconds or ISO8601 timezone timestamp; requires to, excludes period; no fractions
      schema: {type: string}
    To:
      name: to
      in: query
      description: Exclusive UTC whole-second boundary; requires from; maximum range 365 days
      schema: {type: string}
    Period:
      name: period
      in: query
      description: Relative to current UTC time; mutually exclusive with from/to
      schema: {type: string, enum: [5m, 1h, 24h], default: 24h}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 500, default: 100}
    Offset:
      name: offset
      in: query
      description: Offset pagination does not provide snapshot isolation across requests
      schema: {type: integer, minimum: 0, maximum: 100000, default: 0}
    User:
      name: user_id
      in: query
      description: Exact Remnawave ID; must match path user if present
      schema: {type: string}
    UserPath:
      name: id
      in: path
      required: true
      schema: {type: string}
    Node:
      name: node_id
      in: query
      schema: {type: string}
    Search:
      name: search
      in: query
      description: Case-normalized substring in stored IDNA domain
      schema: {type: string, maxLength: 253}
    View:
      name: view
      in: query
      description: Optional aggregate activity view with contemporaneous node network context
      schema: {type: string, enum: [activity]}
    Bucket:
      name: bucket
      in: query
      schema: {type: string, enum: [hour, day], default: hour}
  responses:
    Statistics:
      description: Filtered and paginated results; unknown fields are null
      headers:
        Cache-Control:
          schema: {type: string, const: no-store}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    BadRequest:
      description: Invalid, unknown, repeated or conflicting parameters
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Missing or invalid shared Bearer token
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Busy:
      description: Query interrupted by 2-second budget or storage busy
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string}
    Envelope:
      type: object
      required: [items, total, limit, offset, period, quality]
      properties:
        items:
          type: array
          items:
            anyOf:
              - $ref: '#/components/schemas/Statistic'
              - $ref: '#/components/schemas/Event'
        total: {type: integer, minimum: 0}
        limit: {type: integer}
        offset: {type: integer}
        period:
          type: object
          required: [from, to]
          properties:
            from: {type: integer}
            to: {type: integer}
        quality: {$ref: '#/components/schemas/Quality'}
    Statistic:
      type: object
      required: [connections, first_seen, last_seen, measured_connections, bytes_transferred]
      properties:
        domain: {type: [string, 'null']}
        destination_ip: {type: [string, 'null']}
        user_id: {type: string}
        bucket_start: {type: integer, description: UTC bucket start in Unix seconds}
        connections: {type: integer, minimum: 1}
        first_seen: {type: integer}
        last_seen: {type: integer}
        measured_connections: {type: integer, minimum: 0}
        bytes_transferred:
          type: [integer, 'null']
          description: Present only when all included connections have exact measurements
        network_load:
          type: array
          description: Node interface load; never attributed to this domain or user
          items:
            type: object
            required: [node_id, average_bps, peak_bps, samples]
            properties:
              node_id: {type: string}
              average_bps: {type: number}
              peak_bps: {type: number}
              samples: {type: integer}
    Event:
      type: object
      required: [event_id, node_id, user_id, timestamp, domain, destination_ip, client_ip, protocol, destination_port, inbound, outbound, source, confidence, bytes_transferred, connections]
      properties:
        event_id: {type: string}
        node_id: {type: string}
        user_id: {type: string}
        timestamp: {type: integer, description: Unix UTC seconds}
        domain: {type: [string, 'null']}
        destination_ip: {type: [string, 'null']}
        client_ip: {type: [string, 'null'], description: Observed Xray peer address; may be reverse proxy}
        protocol: {type: string, enum: [tcp, udp]}
        destination_port: {type: integer, minimum: 1, maximum: 65535}
        inbound: {type: string}
        outbound: {type: string}
        source:
          type: string
          enum: [client_request, http_host, tls_sni, quic_sni, fakedns, dns_metadata, xray_access, ip_only]
        confidence: {type: string, enum: [observed, attributed, unknown]}
        bytes_transferred: {type: [integer, 'null']}
        connections: {type: integer, const: 1}
    Quality:
      type: object
      required: [collection_enabled, registered_connections, domain_connections, domain_coverage, attributed_connections, complete, timestamp_precision, event_retention_days, aggregate_retention_days, period_truncated, collector_counters, sniffed_domain_export, traffic_semantics, limitations, connection_semantics]
      properties:
        collection_enabled: {type: boolean}
        collection_paused: {type: boolean}
        pause_reasons: {type: array, items: {type: string}}
        emergency_retention:
          type: [object, 'null']
          properties:
            timestamp: {type: integer}
            removed: {type: object, additionalProperties: {type: integer}}
            early_deletion: {type: boolean}
        registered_connections: {type: integer, description: Filtered aggregate-retention count before excluding IP-only from top}
        domain_connections: {type: integer}
        domain_coverage: {type: [number, 'null'], minimum: 0, maximum: 1}
        attributed_connections: {type: integer, description: Count with observed or attributed confidence}
        complete: {type: boolean, const: false}
        timestamp_precision: {type: string, const: second}
        event_retention_days: {type: integer}
        aggregate_retention_days: {type: integer}
        period_truncated: {type: boolean}
        collector_counters:
          type: object
          description: Global cumulative counters; not filtered by user or period
          additionalProperties: {type: integer}
        sniffed_domain_export: {type: string, const: unavailable_in_stock_xray}
        traffic_semantics: {type: string, const: exact_measurements_only}
        limitations:
          type: array
          items: {type: string}
        connection_semantics: {type: string}
    ActionRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          enum: [server_reboot, xray_restart, xray_update, node_restart, node_update, os_kernel_update, traffic_limits, traffic_clear, oom_protection]
        params:
          type: object
          additionalProperties: false
          description: Traffic uses interface and both rates; OOM optionally service and both memory limits; all other actions take no params
          properties:
            interface: {type: string, maxLength: 15}
            tx_mbps: {type: integer, minimum: 1, maximum: 100000}
            rx_mbps: {type: integer, minimum: 1, maximum: 100000}
            service: {type: string}
            memory_high_mb: {type: integer, minimum: 16}
            memory_max_mb: {type: integer, maximum: 1048576}
        dry_run: {type: boolean, default: true}
        request_id:
          type: string
          pattern: '^[a-zA-Z0-9_-]{8,80}$'
          description: Required when dry_run=false; ID reused with different action/params gives 409
    ActionPlan:
      type: object
      required: [action, params, scope, commands, warnings, execution_enabled, dry_run]
      properties:
        action: {type: string}
        params: {type: object}
        scope: {type: string}
        commands: {type: array, items: {type: array, items: {type: string}}}
        warnings: {type: array, items: {type: string}}
        execution_enabled: {type: boolean}
        dry_run: {type: boolean}
    ServerJob:
      type: object
      required: [id, status, created, updated, plan, completed_steps]
      properties:
        id: {type: string}
        status: {type: string, enum: [queued, running, succeeded, failed, interrupted]}
        created: {type: integer}
        updated: {type: integer}
        plan: {$ref: '#/components/schemas/ActionPlan'}
        completed_steps: {type: integer}
        error: {type: string}
        result: {type: string}
        rollback: {type: string}
    ServerStatus:
      type: object
      required: [server, protection, management]
      properties:
        server:
          type: object
          properties:
            hostname: {type: string}
            os: {type: string}
            os_release: {type: string}
            architecture: {type: string}
            telemetry_scope: {type: string}
            uptime_seconds: {type: [number, 'null']}
            load_average: {type: [array, 'null'], items: {type: number}}
            cpu:
              type: object
              properties:
                logical_cpus: {type: [integer, 'null']}
                model: {type: [string, 'null']}
                usage_percent: {type: [number, 'null']}
            memory:
              type: object
              properties:
                total_bytes: {type: [integer, 'null']}
                available_bytes: {type: [integer, 'null']}
                used_percent: {type: [number, 'null']}
                swap_total_bytes: {type: [integer, 'null']}
                swap_free_bytes: {type: [integer, 'null']}
            network:
              type: array
              items:
                type: object
                properties:
                  interface: {type: string}
                  rx_bytes: {type: integer}
                  tx_bytes: {type: integer}
                  rx_bytes_per_second: {type: [number, 'null']}
                  tx_bytes_per_second: {type: [number, 'null']}
            disks:
              type: array
              items:
                type: object
                properties:
                  path: {type: string}
                  total_bytes: {type: integer}
                  used_bytes: {type: integer}
                  free_bytes: {type: integer}
                  used_percent: {type: number}
                  free_inodes: {type: [integer, 'null']}
                  error: {type: string}
            oom:
              type: object
              properties:
                panic_on_oom: {type: [string, 'null']}
        protection:
          type: object
          properties:
            alerts: {type: array, items: {type: object}}
            collection_paused: {type: boolean}
            pause_reasons: {type: array, items: {type: string}}
            last_emergency_cleanup: {type: [object, 'null']}
            guarantees_no_oom_reboot: {type: boolean, const: false}
        management:
          type: object
          properties:
            enabled: {type: boolean}
            platform: {type: string}
            actions: {type: object, additionalProperties: {type: object}}
            availability_requires: {type: string}
